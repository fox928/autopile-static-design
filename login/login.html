<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Autopile</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Inter,Arial,sans-serif;background:#090b0f;color:#fff;display:grid;grid-template-columns:1.1fr .9fr}.visual{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.7)),url('../assets/hero.svg') center/cover;display:flex;align-items:flex-end;padding:4rem}.visual h1{font-size:clamp(2.5rem,5vw,5rem);line-height:.95;max-width:600px}.panel{display:grid;place-items:center;padding:2rem}.card{width:min(430px,100%)}.logo{width:145px;margin-bottom:3rem}.eyebrow{color:#ff4f36;text-transform:uppercase;letter-spacing:.18em;font-weight:800;font-size:.78rem}.card h2{font-size:2.4rem;margin:.7rem 0}.muted{color:#9ca3af;margin-bottom:2rem}.field{display:grid;gap:.55rem;margin-bottom:1rem}.field label{font-weight:700;font-size:.9rem}.field input{width:100%;padding:1rem 1.1rem;border-radius:14px;border:1px solid #2b3038;background:#13161b;color:#fff;outline:none}.field input:focus{border-color:#ff4f36}.row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin:1rem 0 1.4rem}.row a{color:#ff7a66}.btn{width:100%;border:0;border-radius:999px;background:#ff4f36;color:#fff;font-weight:800;padding:1rem;cursor:pointer}.back{display:inline-block;margin-top:1.5rem;color:#aeb4be;text-decoration:none}.signup{text-align:center;color:#aeb4be;margin-top:1.5rem}.signup a{color:#fff;font-weight:700}@media(max-width:850px){body{grid-template-columns:1fr}.visual{display:none}.panel{min-height:100vh}}</style></head><body><section class="visual"><h1>Welcome back to better builds.</h1></section><main class="panel"><div class="card"><a href="../index.html"><img class="logo" src="../assets/logo.png" alt="Autopile"></a><span class="eyebrow">Member access</span><h2>Sign in</h2><p class="muted">Access saved parts, premium pricing and member-only drops.</p><form><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" placeholder="••••••••"></div><div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div><button class="btn" type="submit">Sign in</button></form><p class="signup">New to Autopile? <a href="#">Create an account</a></p><a class="back" href="../index.html">← Back to home</a></div></main></body></html>
